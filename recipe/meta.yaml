{% set name = "siphash24" %}
{% set version = "1.9" %}

package:
  name: "{{ name|lower }}"
  version: "{{ version }}"

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/siphash24-{{ version }}.tar.gz
  sha256: 0aae53d2074cdddd51d36fac05efb70aa0724654f871c3b1420ca46167b143af

build:
  number: 1

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - meson >=1.0.0                          # [build_platform != target_platform]
    - cython >=3.1.0                         # [build_platform != target_platform]
    - meson-python >=0.18.0                  # [build_platform != target_platform]
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
  host:
    - python
    - cython >=3.1.0
    - meson >=1.0.0
    - meson-python >=0.18.0
    - pip
    - python-build
  run:
    - python

test:
  imports:
    - siphash24
  commands:
    - PYTHONHASHSEED=0 python check.py           # [not win]
    - set "PYTHONHASHSEED=0" && python check.py  # [win]
    - python test.py
  source_files:
    - test.py
    - check.py
  requires:
    - pip

about:
  summary: Streaming-capable SipHash-1-3 and SipHash-2-4 Implementation
  home: https://github.com/dnicolodi/python-siphash24/
  dev_url: https://github.com/dnicolodi/python-siphash24/
  license: 'Apache-2.0 or LGPL-2.1-or-later'
  license_file:
    - LICENSES/Apache-2.0.txt
    - LICENSES/LGPL-2.1-or-later.txt

extra:
  recipe-maintainers:
    - dnicolodi
    - inducer
    - matthiasdiener
